[project]
name = "medical-faculty-agent"
version = "0.1.0"
description = "Discover, extract, and curate publicly listed medical faculty for academic survey outreach (Bangladesh MVP)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "playwright==1.61.0",
    "beautifulsoup4==4.13.3",
    "lxml==5.3.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "email-validator>=2.2.0",
    "aiosqlite==0.20.0",
    "ollama==0.4.4",
    "pdfplumber==0.11.4",
    "typer==0.16.0",
    "PyYAML==6.0.2",
    "rich==13.9.4",
    "httpx==0.28.1",
]

[project.scripts]
ddp = "app.__main__:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# Tooling config below

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "network: tests that require network access",
    "slow: tests that take more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]